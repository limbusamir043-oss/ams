{% extends "teacher.html" %}
{% block title %}Delete Assignment{% endblock %}

{% block content %}
<div style="max-width:500px;background:white;padding:2rem;border-radius:10px;">
    <h3>⚠️ Delete Assignment</h3>
    <p>
        Are you sure you want to delete  
        <strong>"{{ assignment.title }}"</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:#dc2626;color:white;padding:0.6rem 1.2rem;border:none;border-radius:6px;">
            Yes, Delete
        </button>
        <a href="{% url 'teacher_assignments' %}" style="margin-left:10px;">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
